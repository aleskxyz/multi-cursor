<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi Cursor</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <img class="brand-icon" src="/assets/logo.png" alt="" width="48" height="48" />
          <div>
            <h1>Multi Cursor</h1>
            <p class="subtitle">Account &amp; Environment Manager</p>
          </div>
        </div>
        <div id="status" class="status idle">Checking…</div>
      </header>

      <section class="panel">
        <div class="panel-head">
          <label for="env-select">Environment</label>
          <div class="btn-row">
            <button type="button" id="env-new" class="ghost">New</button>
            <button type="button" id="env-rename" class="ghost">Rename</button>
            <button type="button" id="env-delete" class="danger ghost">Delete</button>
          </div>
        </div>
        <select id="env-select"></select>
        <p id="env-disk" class="env-disk muted">Disk usage: —</p>
      </section>

      <section class="panel grow">
        <div class="panel-head">
          <span>Accounts</span>
          <div class="btn-row">
            <button type="button" id="acct-new" class="ghost">New</button>
            <button type="button" id="acct-rename" class="ghost">Rename</button>
            <button type="button" id="acct-delete" class="danger ghost">Delete</button>
          </div>
        </div>
        <ul id="account-list" class="account-list"></ul>
      </section>

      <!-- Floating messages: they overlay the list instead of resizing it. -->
      <div class="toasts" aria-live="polite">
        <p id="error" class="error toast hidden" title="Click to dismiss"></p>
        <p id="success" class="success toast hidden" title="Click to dismiss"></p>
      </div>
      <div id="progress" class="progress hidden" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-label" class="progress-label"></div>
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>

      <footer class="footer">
        <nav id="footer-links" class="footer-links hidden" aria-label="App">
          <span id="footer-version"></span>
          <span aria-hidden="true">·</span>
          <button type="button" id="about-link" class="link">About</button>
          <span aria-hidden="true">·</span>
          <button type="button" id="updates-link" class="link">Check for updates</button>
        </nav>
        <button type="button" id="switch" class="switch" title="Make this Cursor's current account without opening Cursor">Switch</button>
        <button type="button" id="launch" class="primary launch">Launch</button>
      </footer>
    </div>

    <div id="ctx-menu" class="ctx-menu hidden" role="menu" aria-label="Account actions">
      <button type="button" id="ctx-launch" role="menuitem">Launch</button>
      <button type="button" id="ctx-switch" role="menuitem">Switch</button>
      <button type="button" id="ctx-rename" role="menuitem">Rename…</button>
      <button type="button" id="ctx-usage" role="menuitem">Refresh usage</button>
      <div class="ctx-sep" role="separator"></div>
      <button type="button" id="ctx-delete" role="menuitem" class="danger-item">Delete…</button>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <h2 id="modal-title" class="modal-title"></h2>
        <p id="modal-message" class="modal-message hidden"></p>
        <a id="modal-link" class="modal-link hidden" href="#" rel="noopener noreferrer"></a>
        <input id="modal-input" class="modal-input hidden" type="text" autocomplete="off" />
        <label id="modal-check-wrap" class="check hidden">
          <input type="checkbox" id="modal-check" />
          <span id="modal-check-label"></span>
        </label>
        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="ghost">Cancel</button>
          <button type="button" id="modal-confirm" class="primary">OK</button>
        </div>
      </div>
    </div>
  </body>
</html>
