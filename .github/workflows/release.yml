name: Release

# Step 2 of a release, started by merging the "Release v<version>" pull
# request (see prepare-release.yml): when the version on main has no
# release yet, run CI, build every platform and create a DRAFT GitHub
# Release for that commit. Review the draft and click Publish; publishing
# creates the tag and is what the app's update check sees.
#
# Re-running (or Actions -> Release -> Run workflow) refreshes the draft's
# files for the current commit; a published version is never touched.
on:
  push:
    branches: [main]
    paths: [src-tauri/tauri.conf.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is this version unreleased?
        id: check
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::Releases are made from ${DEFAULT_BRANCH} only."
            exit 1
          fi
          version="$(scripts/version.sh)" # fails if the version files disagree
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # Publishing creates the tag, so an existing tag means it's released.
          # Exit code 2 means "no such tag"; anything else is a failed lookup.
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "::notice::${tag} is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ $? -eq 2 ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not check whether ${tag} exists."
            exit 1
          fi

  ci:
    name: CI
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit # optional macOS signing secrets

  publish:
    name: Create draft release
    needs: [prepare, ci, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release
      id-token: write # build provenance attestations
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      MACOS_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: multi-cursor-*
          merge-multiple: true
          path: release

      - name: Checksums
        working-directory: release
        run: |
          sha256sum Multi-Cursor_* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed record that each file was built by this workflow from this
      # commit (verify with `gh attestation verify <file> --repo <owner/repo>`).
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/Multi-Cursor_*

      - name: Release notes
        run: |
          set -euo pipefail
          {
            cat <<EOF
          ## Downloads

          | Platform | File |
          | --- | --- |
          | macOS (Apple Silicon and Intel) | \`Multi-Cursor_${VERSION}_macos-universal.dmg\` |
          | Windows x64 | \`Multi-Cursor_${VERSION}_windows-x64-setup.exe\` (per-user, no admin) or \`.msi\` |
          | Windows arm64 | \`Multi-Cursor_${VERSION}_windows-arm64-setup.exe\` |
          | Linux x64 / arm64 | \`.deb\` (Debian, Ubuntu), \`.rpm\` (Fedora, openSUSE) or \`.AppImage\` |

          EOF
            if [ "$MACOS_SIGNED" != "true" ]; then
              cat <<'EOF'
          **macOS:** this build is not signed. After the first launch is blocked, open **System Settings → Privacy & Security** and choose **Open Anyway** (on macOS 14 and earlier, right-click the app and choose **Open**). Because the app isn't signed, macOS asks again for access to "Cursor Safe Storage" after each update.

          EOF
            fi
            cat <<EOF
          **Windows:** the installers are not signed. If SmartScreen appears, choose **More info → Run anyway**.

          **AppImage:** run \`chmod +x Multi-Cursor_*.AppImage\` before starting it.

          Verify a download with \`SHA256SUMS.txt\`, or with \`gh attestation verify <file> --repo ${GH_REPO}\`.

          EOF
          } > notes.md
          cat notes.md

      - name: Create or update the draft release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A draft from an earlier run: point it at this commit and
            # replace its files, keeping any edited notes.
            gh release edit "$TAG" --target "$GITHUB_SHA"
            gh release upload "$TAG" release/* --clobber
          else
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            # No tag yet: GitHub creates it on this commit when the draft is published.
            gh release create "$TAG" release/* \
              --draft --target "$GITHUB_SHA" \
              --title "Multi Cursor ${TAG}" \
              --notes-file notes.md --generate-notes \
              "${flags[@]}"
          fi
          echo "Draft release: $(gh release view "$TAG" --json url --jq .url)"
